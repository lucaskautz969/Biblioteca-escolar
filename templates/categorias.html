{% extends 'base.html' %}{% from 'macros.html' import csrf %}{% block conteudo %}<h1>Categorias</h1>{% if erro %}<p class="erro">{{ erro }}</p>{% endif %}<form method="post" class="painel formulario" data-aviso>{{ csrf(csrf_token) }}<label for="nome">Nova categoria</label><input id="nome" name="nome" maxlength="100" required><button>Salvar</button></form><ul class="painel">{% for c in categorias %}<li>{{ c['nome'] }}</li>{% else %}<li>Nenhuma categoria.</li>{% endfor %}</ul>{% endblock %}
